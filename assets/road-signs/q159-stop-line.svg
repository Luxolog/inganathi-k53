<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Stop line road marking</title>
  <desc id="desc">Top view of a road approaching an intersection, with a solid white stop line across the lane before the junction.</desc>
  <rect width="900" height="560" fill="#e9ecef"/>
  <rect x="240" y="0" width="420" height="560" rx="2" fill="#555b61"/>
  <rect x="0" y="0" width="900" height="190" fill="#555b61"/>
  <rect x="240" y="0" width="420" height="560" fill="#555b61"/>
  <path d="M450 0 V160" stroke="#f7f7f7" stroke-width="8" stroke-dasharray="34 28" fill="none"/>
  <path d="M450 265 V540" stroke="#f7f7f7" stroke-width="8" stroke-dasharray="34 28" fill="none"/>
  <path d="M270 205 H630" stroke="#fff" stroke-width="18" stroke-linecap="butt"/>
  <path d="M0 190 H900" stroke="#fff" stroke-width="4" opacity=".85"/>
  <path d="M250 190 V560 M650 190 V560" stroke="#f7f7f7" stroke-width="5" stroke-dasharray="30 24" opacity=".8"/>
  <g fill="#fff" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">
    <text x="450" y="250">STOP LINE</text>
    <text x="450" y="300" font-size="17" font-weight="400">Stop before the line</text>
  </g>
</svg>