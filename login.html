<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Inganathi Driving Academy</title><link rel="stylesheet" href="assets/css/dashboard.css"></head>
<body class="preview"><main class="preview-wrap"><a class="brand" href="dashboard-preview.html"><span class="brand-mark">I</span><div><strong>INGANATHI</strong><small>DRIVING ACADEMY</small></div></a><section class="hero"><p class="eyebrow">LEARNER & ADMIN PORTAL</p><h1>Welcome<br><em>back.</em></h1><p class="intro">Sign in to access your learner dashboard or academy administration.</p><form id="loginForm" class="login-form"><label>Email address<input id="email" type="email" autocomplete="username" required placeholder="you@example.com"></label><label>Password<input id="password" type="password" autocomplete="current-password" required placeholder="Your password"></label><button class="btn primary" type="submit">Sign in</button><p id="loginMessage" role="status" aria-live="polite"></p></form><p class="notice">Your account must be created by the academy or through an approved sign-up process.</p></section><footer>Inganathi Driving Academy · K53 Learner Portal</footer></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-client.js"></script><script>
document.getElementById('loginForm').addEventListener('submit',async function(e){e.preventDefault();const msg=document.getElementById('loginMessage');msg.textContent='Signing in…';const {data,error}=await window.inganathiSupabase.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){msg.textContent=error.message;return;}const {data:profile,error:profileError}=await window.inganathiSupabase.from('profiles').select('role,is_active').eq('id',data.user.id).single();if(profileError||!profile||profile.is_active!==true){await window.inganathiSupabase.auth.signOut();msg.textContent='This account is inactive or its profile is unavailable. Please contact the academy.';return;}location.href=profile.role==='admin'?'admin-dashboard.html':'learner-dashboard.html';});
</script></body></html>
